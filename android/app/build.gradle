plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.sea9612.minimahjong'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sea9612.minimahjong'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0.1-offline'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/gameAssets')
    buildTypes.release { minifyEnabled false }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        pyc { src = false }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

tasks.register('compileOfflineScripts', Exec) {
    inputs.files('../../web/app.js', 'src/main/offline/offline_transport.js', '../tools/compile_web.py')
    outputs.dir layout.buildDirectory.dir('generated/compatScripts')
    commandLine providers.gradleProperty('compatPython').getOrElse('python'),
        file('../tools/compile_web.py').absolutePath, '--output',
        layout.buildDirectory.dir('generated/compatScripts').get().asFile.absolutePath
}

tasks.register('prepareGameAssets', Sync) {
    dependsOn 'compileOfflineScripts'
    into layout.buildDirectory.dir('generated/gameAssets')
    from('../..') {
        include 'm?_*.py', 'gui_server.py', 'mazak.py', 'web/**'
        into 'engine'
    }
    from('../../web') {
        exclude 'app.js'
        into 'game'
        filesMatching('index.html') {
            filter { line -> line.replace('width=device-width, initial-scale=1.0', 'width=1100')
                .replace('이 브라우저에 저장합니다', '이 기기에 저장합니다')
                .replace('</head>', '<link rel="stylesheet" href="offline.css"></head>')
                .replace('<script src="app.js', '<script src="offline_bootstrap.js"></script><script src="offline_transport.js"></script><script src="app.js') }
        }
    }
    from('src/main/offline') { exclude 'offline_transport.js'; into 'game' }
    from(layout.buildDirectory.dir('generated/compatScripts')) { into 'game' }
}
tasks.named('preBuild').configure { dependsOn 'prepareGameAssets' }
